<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Sitio Web</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- MENÚ -->
    <nav>
      <h2>Mi Sitio</h2>
      <ul>
        <li>Inicio</li>
        <li>Servicios</li>
        <li>Contacto</li>
        <li>Acerca de</li>
      </ul>
    </nav>

    <!-- HERO -->
    <section class="saludo">
      <h1>Bienvenidos</h1>
      <p>Aprendiendo desarrollo web.</p>
      <button onclick="saludar()">Haz clic</button>
    </section>

    <!-- TARJETAS -->

    <section class="cards">
      <div class="card">HTML</div>
      <div class="card">CSS</div>
      <div class="card">JavaScript</div>
    </section>

    <!-- FORMULARIO actual-->
    <section>
      <h2>Contacto</h2>
      <form>
        <input type="text" placeholder="Nombre" />
        <input type="email" placeholder="Correo" />
        <button>Enviar</button>
      </form>
    </section>

    <!-- FOOTER -->
    <footer><p>Sitio creado por estudiantes</p></footer>
    <script src="./script.jss"></script>
  </body>
</html>
